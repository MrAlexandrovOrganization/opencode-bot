# Selective VLESS egress; provision infra/network/vless-client on the VM first.
services:
  opencode-server:
    container_name: "${CONTAINER_NAME_PREFIX:-}opencode-server"
    dns:
      - 10.245.77.1
    networks:
      whisper-net: {}
      vless-egress:
        ipv4_address: 10.245.77.2
        gw_priority: 100
      loki-net: {}

networks:
  vless-egress:
    external: true
    name: vless-egress
  loki-net:
    external: true
    name: loki-net
