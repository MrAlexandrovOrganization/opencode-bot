services:
  opencode-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      # Protect the server with HTTP basic auth. The bot sends the same
      # OPENCODE_USERNAME / OPENCODE_PASSWORD credentials from .env.
      OPENCODE_SERVER_USERNAME: ${OPENCODE_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_PASSWORD:-}
      # API key for the agent's websearch tool (Exa MCP); without it Exa
      # returns 403. Optional — empty leaves websearch broken.
      EXA_API_KEY: ${EXA_API_KEY:-}
      # Git identity for the agent (git commit), from .env.
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      # Optional GitHub push access for the agent (see scripts/entrypoint.sh):
      #   GIT_DEPLOY_KEY_PATH — путь к смонтированному SSH deploy-ключу (без
      #     пароля) внутри контейнера; см. закомментированный volume ниже.
      #   GH_TOKEN — GitHub PAT (fine-grained, contents:write на репозитории);
      #     переписывает git-URL на HTTPS, SSH не требуется.
      GIT_DEPLOY_KEY_PATH: ${GIT_DEPLOY_KEY_PATH:-}
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      # Read-only access to the whole home directory ("читай почти всё").
      - /home/maxim:/home/maxim:ro
      # Writable project root — the only place the agent may edit files.
      # Overrides the read-only /home/maxim mount for this subtree.
      - /home/maxim/projects:/workspace
      # Reuse the host opencode state (config, plugins, DB, provider auth).
      - /home/maxim/.config/opencode:/mnt/config
      - /home/maxim/.local/share/opencode:/mnt/data
      - /home/maxim/.cache/opencode:/mnt/cache
      # Deploy-ключ для git push в GitHub. Ключ на хосте — ~/.ssh/github
      # (без парольной фразы, даёт write-доступ к нужным репозиториям).
      # Путь внутри контейнера задаётся в GIT_DEPLOY_KEY_PATH (см. .env).
      - /home/maxim/.ssh/github:/run/secrets/git_deploy_id_ed25519:ro
    networks:
      - whisper-net
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-u", "${OPENCODE_USERNAME:-opencode}:${OPENCODE_PASSWORD:-}", "http://localhost:4096/global/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  opencode-backend:
    build:
      context: ../../backends/opencode-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      opencode-server:
        condition: service_healthy
    environment:
      # Единственный клиент opencode-сервера — шлюз.
      OPENCODE_BASE_URL: http://opencode-server:4096
      OPENCODE_USERNAME: ${OPENCODE_USERNAME:-opencode}
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-build}
      PERMISSION_MODE: ${PERMISSION_MODE:-ask}
      OPENCODE_REQUEST_TIMEOUT: ${OPENCODE_REQUEST_TIMEOUT:-30m}
      # Рабочая директория шлюза видна opencode-серверу как /workspace —
      # загруженные файлы агент может читать.
      WORKSPACE_DIR: /workspace
      # Токен, которым бот (и другие фронтенды) ходит в шлюз.
      ADMIN_TOKEN: ${BACKEND_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SQLite-файл истории сессий/сообщений (пусто = in-memory). Лежит в
      # /workspace (внешний маунт) — переживает рестарт и шлюза, и бота.
      DB_PATH: /workspace/.opencode-backend/opencode-backend.db
    volumes:
      - /home/maxim/projects:/workspace
    networks:
      - whisper-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    extends:
      file: docker-compose.base.yml
      service: base

  opencode-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      opencode-backend:
        condition: service_healthy
    environment:
      # Бот ходит только в шлюз (REST + WebSocket).
      BACKEND_BASE_URL: http://opencode-backend:8080
      BACKEND_TOKEN: ${BACKEND_TOKEN:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-build}
      PERMISSION_MODE: ${PERMISSION_MODE:-ask}
      OPENCODE_REQUEST_TIMEOUT: ${OPENCODE_REQUEST_TIMEOUT:-30m}
      # Shared local Telegram Bot API server (infra/telegram-bot-api).
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
      # Shared Whisper gRPC service (backends/transcriber)
      WHISPER_GRPC_HOST: whisper-ingress
      WHISPER_GRPC_PORT: "50053"
    networks:
      - telegram-net
      - whisper-net
    extends:
      file: docker-compose.base.yml
      service: base

networks:
  telegram-net:
    external: true
  whisper-net:
    external: true
    name: whisper-net