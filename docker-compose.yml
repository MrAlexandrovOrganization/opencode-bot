services:
  opencode-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        # Provided by the Makefile (exported env); see PROTOC_GEN_* in Makefile.
        PROTOC_GEN_GO_VERSION: ${PROTOC_GEN_GO_VERSION:?PROTOC_GEN_GO_VERSION is unset - build via make, which pins protoc plugin versions}
        PROTOC_GEN_GRPC_VERSION: ${PROTOC_GEN_GRPC_VERSION:?PROTOC_GEN_GRPC_VERSION is unset - build via make, which pins protoc plugin versions}
    restart: unless-stopped
    environment:
      # Protect the server with HTTP basic auth. The bot sends the same
      # OPENCODE_USERNAME / OPENCODE_PASSWORD credentials from .env.
      OPENCODE_SERVER_USERNAME: ${OPENCODE_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_PASSWORD:-}
      # API key for the agent's websearch tool (Exa MCP); without it Exa
      # returns 403. Optional — empty leaves websearch broken.
      EXA_API_KEY: ${EXA_API_KEY:-}
      # Git identity for the agent (git commit), from .env.
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      # Optional GitHub push access for the agent (see scripts/entrypoint.sh):
      #   GIT_DEPLOY_KEY_PATH — путь к смонтированному SSH deploy-ключу (без
      #     пароля) внутри контейнера; см. раскомментированный volume ниже.
      #   GH_TOKEN — GitHub PAT (fine-grained, contents:write на репозитории);
      #     переписывает git-URL на HTTPS, SSH не требуется.
      GIT_DEPLOY_KEY_PATH: ${GIT_DEPLOY_KEY_PATH:-}
    volumes:
      # Read-only access to the whole home directory ("читай почти всё").
      - ${HOME}:/home/maxim:ro
      # Writable project root — the only place the agent may edit files.
      # Overrides the read-only /home/maxim mount for this subtree.
      - ${HOME}/projects:/workspace
      # Reuse the host opencode state (config, plugins, DB, provider auth).
      - ${HOME}/.config/opencode:/mnt/config
      - ${HOME}/.local/share/opencode:/mnt/data
      - ${HOME}/.cache/opencode:/mnt/cache
      # Deploy-ключ для git push в GitHub. Ключ на хосте — ~/.ssh/github
      # (без парольной фразы, даёт write-доступ к нужным репозиториям).
      # Путь внутри контейнера задаётся в GIT_DEPLOY_KEY_PATH (см. .env).
      - ${HOME}/.ssh/github:/run/secrets/git_deploy_id_ed25519:ro
    ports:
      - "127.0.0.1:4096:4096"
    networks:
      - whisper-net
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-u", "${OPENCODE_USERNAME:-opencode}:${OPENCODE_PASSWORD:-}", "http://localhost:4096/global/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # opencode-backend (шлюз) НЕ поднимается в этом стеке: он разрабатывается и
  # деплоится отдельно (свой репозиторий + CI, см. backends/opencode-backend).
  # Уже запущенный шлюз должен быть доступен на сети whisper-net под именем
  # opencode-backend (порт 8080) — бот ходит в него через BACKEND_BASE_URL.

  opencode-bot:
    build:
      context: .
      args:
        # Provided by the Makefile (exported env); see PROTOC_GEN_* in Makefile.
        PROTOC_GEN_GO_VERSION: ${PROTOC_GEN_GO_VERSION:?PROTOC_GEN_GO_VERSION is unset - build via make, which pins protoc plugin versions}
        PROTOC_GEN_GRPC_VERSION: ${PROTOC_GEN_GRPC_VERSION:?PROTOC_GEN_GRPC_VERSION is unset - build via make, which pins protoc plugin versions}
    restart: unless-stopped
    env_file: .env
    environment:
      # Бот ходит только в шлюз (REST + WebSocket), поднятый отдельно.
      # Шлюз — сервис opencode-backend на сети whisper-net.
      BACKEND_BASE_URL: http://opencode-backend:8080
      BACKEND_TOKEN: ${BACKEND_TOKEN:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-build}
      PERMISSION_MODE: ${PERMISSION_MODE:-ask}
      OPENCODE_REQUEST_TIMEOUT: ${OPENCODE_REQUEST_TIMEOUT:-30m}
      # Shared local Telegram Bot API server (infra/telegram-bot-api).
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
      # Shared Whisper gRPC service (backends/transcriber)
      WHISPER_GRPC_HOST: whisper-ingress
      WHISPER_GRPC_PORT: "50053"
      OTEL_SERVICE_NAME: opencode-bot
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_PROPAGATORS: tracecontext
    networks:
      - telegram-net
      - whisper-net
      - jaeger-net
    # Локальный Bot API-сервер хранит скачанные файлы (голос/видео/доки) на
    # диске; читаем их напрямую, минуя 404 от /file/ в --local режиме.
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    extends:
      file: docker-compose.base.yml
      service: base

networks:
  telegram-net:
    external: true
  whisper-net:
    external: true
    name: whisper-net
  jaeger-net:
    external: true
    name: jaeger-net

volumes:
  telegram-bot-api-data:
    external: true
    name: telegram-bot-api-data
